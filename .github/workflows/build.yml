name: Build
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run selected regression suites
        shell: pwsh
        run: ./tools/Test.ps1
      - name: Package standalone executable
        shell: pwsh
        run: ./tools/Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Rion-Win-11-win-x64
          path: dist/free/
